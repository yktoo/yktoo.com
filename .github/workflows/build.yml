name: Build and test workflow
on:
  - push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
            node-version: 24

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Install hugo
        run: |
          export HUGO_VERSION=0.169.0
          curl -fSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Generate website
        run: yarn run build:prod

      # Options are in lychee.toml; absolute links to the site itself are remapped onto the generated files
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config   lychee.toml
            --root-dir ${{ github.workspace }}/public
            --remap    'https://yktoo\.com/(.*) file://${{ github.workspace }}/public/$1'
            'public/**/*.html'

      - name: End-2-end tests
        run: |
          yarn run start:e2e &
          yarn run cy:ci
