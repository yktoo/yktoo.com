name: Build and test workflow
on:
  - push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
            node-version: 24

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Install hugo
        run: |
          export HUGO_VERSION=0.169.0
          curl -fSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Install Ruby and the gems
        uses: ruby/setup-ruby@v1
        with:
          # Ruby version comes from .ruby-version; gems are installed from Gemfile.lock and cached
          bundler-cache: true

      - name: Generate website
        run: yarn run build:prod

      - name: Run HTMLProofer
        run:
          bundle exec htmlproofer public/
            --allow-missing-href
            --checks Links,Images,Scripts,Favicon,OpenGraph
            --disable-external
            --no-enforce-https
            --ignore-empty-mailto

      - name: End-2-end tests
        run: |
          yarn run start:e2e &
          yarn run cy:ci
